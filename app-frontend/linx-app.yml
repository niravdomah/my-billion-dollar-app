# Environment variables exposed to the Linx Portal
env:
  - name: PORT
    default: "3000"

  # Where the frontend sends its API calls. In the Linx Portal, paste the backend
  # instance's internal address, for example linx-demo--dev--backend:8042
  - name: SETTING__BackendUrl

# Linx Portal configuration for the application
port:
  default: 3000
  linked_env_var: PORT
